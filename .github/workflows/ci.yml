name: CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        mode: [shared, static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build scdoc libssl-dev libarchive-dev
      - name: Qualify
        run: ./ci/qualify.sh ${{ matrix.mode }}
